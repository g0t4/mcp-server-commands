[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-commands"
version = "0.10.0"
description = "Unified MCP server to run commands via bash and xonsh"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.9,<2",
    "xonsh>=0.19",
    "rich>=13",
]

[project.scripts]
mcp-server-commands = "mcp_server_commands.server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
